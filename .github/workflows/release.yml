name: Release apps

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      TERMGRID_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements.txt

      - name: Build standalone app
        run: |
          mkdir -p build
          python make-icon.py build/termgrid.icns
          python -m PyInstaller --clean --noconfirm packaging/termgrid.spec

      - name: Verify relocated app in a clean environment
        run: |
          relocated=$(mktemp -d)
          trap 'rm -rf "$relocated"' EXIT
          ditto dist/termgrid.app "$relocated/termgrid.app"
          mkdir -p "$relocated/home" "$relocated/tmp"
          codesign --verify --deep --strict "$relocated/termgrid.app"
          lipo "$relocated/termgrid.app/Contents/MacOS/termgrid" -verify_arch "$TARGET_ARCH"
          test -f "$relocated/termgrid.app/Contents/Resources/termgrid.toml"
          cd "$relocated"
          env -i HOME="$relocated/home" TMPDIR="$relocated/tmp/" PATH=/usr/bin:/bin \
            ./termgrid.app/Contents/MacOS/termgrid --help
          env -i HOME="$relocated/home" TMPDIR="$relocated/tmp/" PATH=/usr/bin:/bin \
            ./termgrid.app/Contents/MacOS/termgrid --dry-run

      - name: Archive app
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/termgrid.app \
            "termgrid-${TERMGRID_VERSION}-macos-${TARGET_ARCH}.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termgrid-macos-${{ matrix.arch }}
          path: termgrid-*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

  windows-icon:
    name: Draw Windows icon
    # make-icon.py draws from Terminal's own icon, which only macOS has.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements.txt

      - name: Install drawing dependencies
        run: python -m pip install -r packaging/requirements.txt

      - name: Draw icon
        run: |
          mkdir -p build
          python make-icon.py build/termgrid.ico

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-icon
          path: build/termgrid.ico
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs: windows-icon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x86_64
            python-arch: x64
          - runner: windows-11-arm
            arch: arm64
            python-arch: arm64
    env:
      TERMGRID_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}
      TARGET_ARCH: ${{ matrix.arch }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          # PyInstaller builds for the Python running it, so arm64 needs a native arm64 Python.
          architecture: ${{ matrix.python-arch }}
          cache: pip
          cache-dependency-path: packaging/requirements.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-icon
          path: build

      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements.txt

      - name: Build standalone executable
        run: |
          # The spec builds without an icon when it is missing; a release must have it.
          if (-not (Test-Path build\termgrid.ico)) {
            throw "build\termgrid.ico is missing"
          }
          python -m PyInstaller --clean --noconfirm packaging/termgrid.spec

      - name: Verify relocated executable in a clean environment
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $relocated = Join-Path $env:RUNNER_TEMP relocated
          New-Item -ItemType Directory -Force "$relocated\home", "$relocated\tmp" | Out-Null
          Copy-Item dist\termgrid.exe $relocated
          $bytes = [IO.File]::ReadAllBytes("$relocated\termgrid.exe")
          $machine = @{ x86_64 = 0x8664; arm64 = 0xAA64 }[$env:TARGET_ARCH]
          if ([BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4) -ne $machine) {
            throw "termgrid.exe is not an $env:TARGET_ARCH executable"
          }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:USERPROFILE = $env:LOCALAPPDATA = "$relocated\home"
          $env:TEMP = $env:TMP = "$relocated\tmp"
          Remove-Item Env:XDG_CONFIG_HOME -ErrorAction SilentlyContinue
          Set-Location $relocated
          .\termgrid.exe --help
          $plan = .\termgrid.exe --dry-run | Out-String
          $plan
          # Without its bundled termgrid.toml, termgrid would plan 1x1 grids.
          if ($plan -notmatch 'grid 2x2') {
            throw "termgrid.exe did not use its bundled termgrid.toml"
          }

      - name: Name executable for release
        run: Copy-Item dist\termgrid.exe "termgrid-$env:TERMGRID_VERSION-windows-$env:TARGET_ARCH.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termgrid-windows-${{ matrix.arch }}
          path: termgrid-*-windows-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: termgrid-*
          merge-multiple: true
          path: release-assets

      - name: Publish archives and checksums
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum ./*.zip ./*.exe > SHA256SUMS
          options=(--verify-tag --generate-notes --title "termgrid $RELEASE_TAG")
          version_without_metadata=${RELEASE_TAG%%+*}
          if [[ "$version_without_metadata" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" ./*.zip ./*.exe SHA256SUMS "${options[@]}"
