name: Release macOS app

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      TERMGRID_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements.txt

      - name: Build standalone app
        run: |
          mkdir -p build
          python make-icon.py build/termgrid.icns
          python -m PyInstaller --clean --noconfirm packaging/termgrid.spec

      - name: Verify relocated app in a clean environment
        run: |
          relocated=$(mktemp -d)
          trap 'rm -rf "$relocated"' EXIT
          ditto dist/termgrid.app "$relocated/termgrid.app"
          mkdir -p "$relocated/home" "$relocated/tmp"
          codesign --verify --deep --strict "$relocated/termgrid.app"
          lipo -verify_arch "$TARGET_ARCH" "$relocated/termgrid.app/Contents/MacOS/termgrid"
          test -f "$relocated/termgrid.app/Contents/Resources/termgrid.toml"
          cd "$relocated"
          env -i HOME="$relocated/home" TMPDIR="$relocated/tmp/" PATH=/usr/bin:/bin \
            ./termgrid.app/Contents/MacOS/termgrid --help
          env -i HOME="$relocated/home" TMPDIR="$relocated/tmp/" PATH=/usr/bin:/bin \
            ./termgrid.app/Contents/MacOS/termgrid --dry-run

      - name: Archive app
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/termgrid.app \
            "termgrid-${TERMGRID_VERSION}-macos-${TARGET_ARCH}.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termgrid-macos-${{ matrix.arch }}
          path: termgrid-*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: termgrid-macos-*
          merge-multiple: true
          path: release-assets

      - name: Publish archives and checksums
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum ./*.zip > SHA256SUMS
          options=(--verify-tag --generate-notes --title "termgrid $RELEASE_TAG")
          version_without_metadata=${RELEASE_TAG%%+*}
          if [[ "$version_without_metadata" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" ./*.zip SHA256SUMS "${options[@]}"
